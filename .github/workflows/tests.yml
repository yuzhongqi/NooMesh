name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m examples.demo
      - run: python -m examples.agent_demo
      - run: python -m examples.lifecycle_demo --output "$RUNNER_TEMP/llr-lifecycle"
      - run: python -m pip wheel . --no-deps --wheel-dir dist
